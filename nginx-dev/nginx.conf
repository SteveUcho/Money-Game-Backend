server {
    listen 80;
    server_name localhost;

    # Route all requests starting with /ory-kratos/ to Kratos
    location /ory-kratos/ {
        proxy_pass http://kratos:4433/; # Ensure the trailing slash
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Route all requests starting with /api/ to game-backend
    location /api/ {
        proxy_pass http://game-backend-dev:8080/; # Ensure the trailing slash
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Route requests to local Vite server
    location / {
        # host.docker.internal points to physical machine from inside Docker
        proxy_pass http://host.docker.internal:5173/; 
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade; # Required for Vite HMR
        proxy_set_header Connection "Upgrade";
    }
}
