version: v1.1.0

dsn: postgres://root@cockroach:26257/defaultdb?sslmode=disable

serve:
  public:
    base_url: http://localhost:4433
    cors:
      enabled: true
  admin:
    base_url: http://localhost:4434

selfservice:
  default_browser_return_url: http://localhost:3000

  methods:
    password:
      enabled: true

    oidc:
      enabled: true
      config:
        providers:
          - id: google
            provider: google
            client_id: YOUR_GOOGLE_CLIENT_ID
            client_secret: YOUR_GOOGLE_SECRET

          - id: discord
            provider: discord
            client_id: YOUR_DISCORD_CLIENT_ID
            client_secret: YOUR_DISCORD_SECRET

  flows:
    login:
      ui_url: http://localhost:3000/login

    registration:
      ui_url: http://localhost:3000/register

log:
  level: debug

secrets:
  cookie:
    - REPLACE_WITH_LONG_RANDOM_STRING

identity:
  default_schema_id: default

  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

session:
  cookie:
    persistent: true