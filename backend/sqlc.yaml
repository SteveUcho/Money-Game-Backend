version: "2"
sql:
  - engine: "postgresql"
    schema: "/sql/migrations"
    queries: "/sql/queries"
    gen:
      go:
        package: "sqlQueries"
        out: "gen/sqlQueries"
        sql_package: "pgx/v5"
        overrides:
          # 1. Non-nullable UUIDs (e.g., PRIMARY KEY)
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # 2. Nullable UUIDs (e.g., optional foreign keys)
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
